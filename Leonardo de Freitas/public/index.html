<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Inovação - Sala 4.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustes específicos para a vitrine pública */
        .hero {
            background: linear-gradient(rgba(46, 125, 50, 0.8), rgba(26, 26, 26, 0.9)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920');
            background-size: cover;
            padding: 60px 20px;
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .search-container {
            max-width: 600px;
            margin: -30px auto 40px;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-size: 1.1rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 0 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tool-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover { transform: translateY(-8px); }
        .tool-capa {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .tool-capa::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60%;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }
        .tool-capa h3 {
            position: absolute;
            bottom: 15px; left: 20px;
            color: white; margin: 0; z-index: 2;
            font-size: 1.4rem;
        }
        .tool-content { padding: 20px; flex-grow: 1; position: relative; }
        .tool-type {
            display: inline-block;
            background: var(--light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
        .tool-icon {
            position: absolute;
            top: -30px; right: 20px;
            width: 50px; height: 50px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 4px solid white;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Hub de Ferramentas - Sala 4.0</h1>
        <p>Acelerando a transformação digital na produção de celulose.</p>
        <a href="login.html" style="color: white; opacity: 0.6; text-decoration: none; font-size: 0.8rem;">Acesso Restrito</a>
    </section>

    <div class="search-container">
        <input type="text" id="filtro" placeholder="O que você está procurando? (Ex: Dashboard, Manutenção...)" onkeyup="filtrar()">
    </div>

    <div class="card-grid" id="container-ferramentas">
        </div>

    <script>
        let ferramentasLocais = [];

        async function carregarFerramentas() {
            try {
                const res = await fetch('/api/ferramentas');
                ferramentasLocais = await res.json();
                renderizar(ferramentasLocais);
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        function renderizar(lista) {
            const container = document.getElementById('container-ferramentas');
            container.innerHTML = lista.map(f => `
                <div class="tool-card">
                    <div class="tool-capa" style="background-image: url('${f.capa || 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=800'}')">
                        <h3>${f.nome}</h3>
                    </div>
                    <div class="tool-content">
                        <div class="tool-icon"><i class="fas ${f.icone || 'fa-gear'}"></i></div>
                        <span class="tool-type">${f.tipo}</span>
                        <p style="color: #666; font-size: 0.95rem; line-height: 1.4;">${f.descricao}</p>
                        <a href="${f.link}" target="_blank" class="btn" style="text-decoration: none; display: block; margin-top: 15px;">
                            <i class="fas fa-external-link-alt"></i> Acessar Ferramenta
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filtrar() {
            const termo = document.getElementById('filtro').value.toLowerCase();
            const filtradas = ferramentasLocais.filter(f => 
                f.nome.toLowerCase().includes(termo) || 
                f.tipo.toLowerCase().includes(termo) ||
                f.descricao.toLowerCase().includes(termo)
            );
            renderizar(filtradas);
        }

        carregarFerramentas();
    </script>
</body>
</html>
